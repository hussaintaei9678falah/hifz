name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get whisper.cpp
        run: |
          git clone --depth 1 --branch v1.7.4 https://github.com/ggerganov/whisper.cpp app/src/main/cpp/whisper.cpp
          git clone --depth 1 https://github.com/openai/whisper /tmp/openai-whisper

      - name: Convert Quran model to ggml
        run: |
          pip install "numpy<2" "transformers==4.44.2" huggingface_hub
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download, hf_hub_download
          d = snapshot_download("tarteel-ai/whisper-base-ar-quran", local_dir="/tmp/hfmodel")
          for f in ["vocab.json", "added_tokens.json", "merges.txt", "normalizer.json", "tokenizer_config.json", "special_tokens_map.json"]:
              if not os.path.exists(os.path.join(d, f)):
                  try:
                      hf_hub_download("openai/whisper-base", f, local_dir=d)
                  except Exception as e:
                      print("skip", f, e)
          print(os.listdir(d))
          PY
          mkdir -p /tmp/out app/src/main/assets
          python app/src/main/cpp/whisper.cpp/models/convert-h5-to-ggml.py /tmp/hfmodel /tmp/openai-whisper /tmp/out
          ls -la /tmp/out
          mv /tmp/out/ggml-model.bin app/src/main/assets/model.bin

      - name: Download Quran text
        run: |
          mkdir -p app/src/main/assets/juz
          python - <<'PY'
          import json, urllib.request, time
          for n in range(1, 31):
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen("https://api.alquran.cloud/v1/juz/%d/quran-uthmani" % n, timeout=60) as r:
                          ay = json.load(r)["data"]["ayahs"]
                      break
                  except Exception as e:
                      print("retry", n, e); time.sleep(3)
              out = [[a["surah"]["number"], a["numberInSurah"], a["text"]] for a in ay]
              json.dump(out, open("app/src/main/assets/juz/%d.json" % n, "w", encoding="utf-8"), ensure_ascii=False)
          print("ok")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HifzChecker-offline-apk
          path: app/build/outputs/apk/debug/app-debug.apk
